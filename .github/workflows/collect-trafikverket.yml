name: Collect Trafikverket train outcomes

on:
  schedule:
    - cron: "7,37 * * * *"
    - cron: "19 2 * * *"
  workflow_dispatch:

concurrency:
  group: trafikverket-train-collector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TRAFIKVERKET_API_KEY: ${{ secrets.TRAFIKVERKET_API_KEY }}
      TRAFIKVERKET_API_URL: https://api.trafikinfo.trafikverket.se/v2/data.json
      TRAFIKVERKET_MIN_REQUEST_INTERVAL_MS: "500"
      TRAFIKVERKET_RATE_LIMIT_RETRIES: "2"
    steps:
      - name: Check collector configuration
        id: config
        run: |
          if [[ -n "$DATABASE_URL" && -n "$TRAFIKVERKET_API_KEY" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Collector skipped until DATABASE_URL and TRAFIKVERKET_API_KEY secrets are configured."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.config.outputs.ready == 'true'
      - run: npx prisma generate
        if: steps.config.outputs.ready == 'true'
      - run: npm run db:migrate
        if: steps.config.outputs.ready == 'true'
      - name: Collect a rolling observation window
        if: steps.config.outputs.ready == 'true'
        run: npm run trains:collect -- --hours-back=6 --hours-ahead=3 --chunk-hours=9

  sync-schedule:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '19 2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TRAFIKVERKET_API_KEY: ${{ secrets.TRAFIKVERKET_API_KEY }}
      TRAFIKVERKET_API_URL: https://api.trafikinfo.trafikverket.se/v2/data.json
      TRAFIKVERKET_MIN_REQUEST_INTERVAL_MS: "500"
      TRAFIKVERKET_RATE_LIMIT_RETRIES: "2"
    steps:
      - name: Check collector configuration
        id: config
        run: |
          if [[ -n "$DATABASE_URL" && -n "$TRAFIKVERKET_API_KEY" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Schedule sync skipped until DATABASE_URL and TRAFIKVERKET_API_KEY secrets are configured."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.config.outputs.ready == 'true'
      - run: npx prisma generate
        if: steps.config.outputs.ready == 'true'
      - run: npm run db:migrate
        if: steps.config.outputs.ready == 'true'
      - name: Materialize the next eight days of direct train schedules
        if: steps.config.outputs.ready == 'true'
        run: npm run trains:sync-schedule
