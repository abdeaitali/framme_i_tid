services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: framme
      POSTGRES_PASSWORD: framme
      POSTGRES_DB: framme_i_tid
    ports:
      - "5432:5432"
    volumes:
      - framme_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U framme -d framme_i_tid"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  framme_postgres_data:
